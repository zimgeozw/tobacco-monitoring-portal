---
# cPanel → Git™ Version Control → "Deploy HEAD Commit" copies the app to the
# document root of timb.zimgeo.co.zw (see cPanel → Domains).
deployment:
  tasks:
    - export DEPLOYPATH=/home/zimgeoco/public_html/timb.zimgeo.co.zw/
    - /bin/mkdir -p $DEPLOYPATH
    - /usr/bin/rsync -a --delete --exclude='.git' --exclude='.cpanel.yml' --exclude='config.php' --exclude='storage/' --exclude='.well-known/' --exclude='cgi-bin/' --exclude='error_log' ./ $DEPLOYPATH
    - /bin/mkdir -p ${DEPLOYPATH}storage/uploads ${DEPLOYPATH}storage/cache ${DEPLOYPATH}storage/logs
    - /bin/cp -f storage/.htaccess ${DEPLOYPATH}storage/.htaccess
